<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارگاه زبان‌سازی — سفر به دنیای خلق زبان</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
  :root{
    --bg: #131f28;
    --bg-panel: #1a2933;
    --bg-panel-raised: #21333f;
    --bg-input: #0f1922;
    --ink: #ece3cf;
    --ink-dim: #93a6ae;
    --ink-faint: #62747c;
    --gold: #d3a24c;
    --gold-dim: #7c6535;
    --teal: #6fada0;
    --brick: #bd6249;
    --line: #2a3c47;
    --line-soft: #223038;
    --font-main: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font-main);
    line-height:1.8;-webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:0 0 80px;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:24px;
    padding:20px 26px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:12px;}
  .brand-mark{font-size:28px;color:var(--gold);line-height:1;}
  .brand h1{font-weight:700;font-size:20px;margin:0;color:var(--ink);}
  .brand .sub{font-size:12.5px;color:var(--ink-faint);margin-top:3px;}
  .progress-wrap{display:flex;align-items:center;gap:10px;min-width:220px;}
  .progress-track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));width:0%;transition:width .4s ease;}
  #progressLabel{font-size:12px;color:var(--ink-dim);white-space:nowrap;}
  .reset-btn{background:none;border:1px solid var(--line);color:var(--ink-faint);font-size:11.5px;padding:6px 10px;border-radius:5px;cursor:pointer;font-family:var(--font-main);}
  .reset-btn:hover{color:var(--brick);border-color:var(--brick);}

  .layout{display:flex;gap:0;align-items:flex-start;}
  .rail{width:260px;flex:none;position:sticky;top:0;padding:18px 22px 40px 10px;border-inline-start:1px solid var(--line);max-height:100vh;overflow-y:auto;}
  .rail-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:6px;cursor:pointer;color:var(--ink-dim);font-size:13.5px;margin-bottom:2px;transition:background .15s ease,color .15s ease;}
  .rail-item:hover{background:var(--bg-panel);color:var(--ink);}
  .rail-item.active{background:var(--bg-panel-raised);color:var(--gold);}
  .rail-num{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;border:1px solid var(--line-soft);color:var(--ink-faint);}
  .rail-item.active .rail-num{border-color:var(--gold);color:var(--gold);}
  .rail-item.filled .rail-num{background:var(--gold-dim);color:var(--bg);border-color:var(--gold-dim);}
  .rail-item.active.filled .rail-num{background:var(--gold);color:var(--bg);border-color:var(--gold);}
  
  .stage{flex:1;min-width:0;padding:30px 40px 40px;}
  .section-head{margin-bottom:20px;}
  .section-eyebrow{font-size:12px;color:var(--ink-faint);}
  .section-title{font-size:24px;font-weight:700;margin:4px 0 0;color:var(--ink);}

  .subnav{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px;}
  .subnav-item{padding:6px 13px;border-radius:16px;border:1px solid var(--line);color:var(--ink-dim);font-size:12.5px;cursor:pointer;}
  .subnav-item:hover{border-color:var(--gold-dim);color:var(--ink);}
  .subnav-item.active{background:var(--gold-dim);border-color:var(--gold-dim);color:var(--bg);font-weight:600;}
  .subnav-item.filled::after{content:" ●";font-size:8px;color:var(--gold);}

  .guide{background:var(--bg-panel);border:1px solid var(--line);border-inline-start:3px solid var(--gold-dim);border-radius:4px;padding:14px 18px;margin-bottom:22px;font-size:14px;color:var(--ink-dim);}
  .guide p{margin:0 0 8px;}
  .guide p:last-child{margin-bottom:0;}
  .guide .example{color:var(--teal);}
  .guide strong{color:var(--ink);}
  .guide ul{margin:8px 0;padding-right:20px;}
  .guide li{margin-bottom:6px;}

  .card{background:var(--bg-panel);border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-bottom:18px;}
  .card.highlight{border-color:var(--gold);background:var(--bg-panel-raised);}
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px;}
  .field .hint{font-size:11.5px;color:var(--ink-faint);margin-top:5px;}
  input[type=text], textarea{width:100%;background:var(--bg-input);border:1px solid var(--line);border-radius:5px;color:var(--ink);padding:9px 11px;font-family:var(--font-main);font-size:13.5px;resize:vertical;}
  input[type=text]:focus, textarea:focus{outline:none;border-color:var(--gold-dim);}
  textarea{min-height:56px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;}
  @media (max-width:640px){.row2,.row3,.row4{grid-template-columns:1fr;}}

  .toggle-group{display:flex;flex-wrap:wrap;gap:8px;}
  .toggle-btn{background:var(--bg-input);border:1px solid var(--line);color:var(--ink-dim);padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;font-family:var(--font-main);transition:all .15s ease;}
  .toggle-btn:hover{border-color:var(--gold-dim);color:var(--ink);}
  .toggle-btn.active{background:var(--gold-dim);border-color:var(--gold-dim);color:var(--bg);font-weight:600;}
  .toggle-btn.active.teal{background:var(--teal);border-color:var(--teal);}

  .check-row{display:flex;align-items:center;gap:9px;margin-bottom:10px;cursor:pointer;font-size:13.5px;color:var(--ink-dim);}
  .check-row:last-child{margin-bottom:0;}
  .check-box{width:17px;height:17px;border-radius:4px;border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;background:var(--bg-input);font-size:11px;color:var(--bg);}
  .check-box.active{background:var(--teal);border-color:var(--teal);}

  .conditional{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}

  .wordgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;}
  @media (max-width:900px){.wordgrid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.wordgrid{grid-template-columns:1fr;}}
  .word-row{background:var(--bg-input);border:1px solid var(--line);border-radius:6px;padding:9px 10px;}
  .word-row .idx{font-size:10.5px;color:var(--ink-faint);margin-bottom:4px;}
  .word-row input{margin-bottom:6px;}
  .word-row input:last-child{margin-bottom:0;}

  .vocab-table{width:100%;border-collapse:collapse;margin-top:10px;background:var(--bg-input);border-radius:6px;overflow:hidden;}
  .vocab-table th{background:var(--bg-panel-raised);padding:10px;text-align:center;color:var(--gold);font-weight:600;border-bottom:1px solid var(--line);}
  .vocab-table td{padding:6px;border-bottom:1px solid var(--line-soft);}
  .vocab-table td input{background:transparent;border:none;color:var(--ink);padding:4px;width:100%;}
  .vocab-table td input:focus{outline:none;background:var(--bg-panel);}
  .vocab-table .row-num{color:var(--gold);font-weight:600;text-align:center;width:40px;}

  .nav-buttons{display:flex;justify-content:space-between;margin-top:28px;}
  .nav-btn{background:none;border:1px solid var(--line);color:var(--ink-dim);padding:10px 18px;border-radius:5px;cursor:pointer;font-size:13.5px;font-family:var(--font-main);}
  .nav-btn:hover{border-color:var(--gold);color:var(--gold);}
  .nav-btn.primary{background:var(--gold-dim);border-color:var(--gold-dim);color:var(--bg);font-weight:600;}
  .nav-btn.primary:hover{background:var(--gold);border-color:var(--gold);color:var(--bg);}
  .nav-btn:disabled{opacity:.3;cursor:default;}
  .nav-btn:disabled:hover{border-color:var(--line);color:var(--ink-dim);}

  .summary-card{background:var(--bg-panel);border:1px solid var(--gold-dim);border-radius:6px;padding:26px 30px;}
  .summary-card h3{font-size:15px;color:var(--gold);margin:22px 0 8px;font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line-soft);}
  .summary-card h3:first-child{margin-top:0;}
  .summary-card p{margin:4px 0;font-size:14.5px;color:var(--ink);line-height:1.8;}
  .summary-card .empty{color:var(--ink-faint);font-style:italic;}
  .copy-btn{margin-top:18px;background:none;border:1px solid var(--gold-dim);color:var(--gold);padding:8px 16px;border-radius:5px;cursor:pointer;font-size:13px;font-family:var(--font-main);}
  .copy-btn:hover{background:var(--gold-dim);color:var(--bg);}

  .mobile-tabs{display:none;}
  @media (max-width:860px){
    .rail{display:none;}
    .mobile-tabs{display:flex;overflow-x:auto;gap:6px;padding:14px 16px;border-bottom:1px solid var(--line);}
    .mobile-tab{flex:none;padding:7px 13px;border-radius:16px;border:1px solid var(--line);color:var(--ink-dim);font-size:12.5px;white-space:nowrap;cursor:pointer;}
    .mobile-tab.active{background:var(--gold-dim);color:var(--bg);border-color:var(--gold-dim);}
    .stage{padding:22px 18px 40px;}
  }
  .saved-flag{position:fixed;bottom:18px;left:22px;background:var(--bg-panel-raised);border:1px solid var(--gold-dim);color:var(--gold);font-size:12px;padding:8px 14px;border-radius:5px;opacity:0;transition:opacity .3s ease;pointer-events:none;}
  .saved-flag.show{opacity:1;}
  
  .pale-box{background:#2a2418;border:1px solid var(--gold-dim);border-radius:6px;padding:16px 20px;margin:14px 0;color:var(--ink);font-size:14px;}
  .pale-box strong{color:var(--gold);}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">§</span>
      <div>
        <h1>کارگاه زبان‌سازی</h1>
        <div class="sub">جمع علمی-ترویجی رستا | رویداد تابستانه ۱۴۰۵ | سوالات اتاق فکر</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span id="progressLabel">۰٪</span>
      <button class="reset-btn" id="resetBtn">پاک‌سازی همه</button>
    </div>
  </div>

  <div class="mobile-tabs" id="mobileTabs"></div>

  <div class="layout">
    <nav class="rail" id="rail"></nav>
    <main class="stage" id="stage"></main>
  </div>
</div>
<div class="saved-flag" id="savedFlag">ذخیره شد</div>

<script>
(function(){

  const STORAGE_KEY = 'rasta-lang-workshop:v3';

  const TOP = [
    {id:'intro', num:'', label:'سفر به دنیای خلق زبان'},
    {id:'step1', num:'۱', label:'گام اول: دنیای زبان'},
    {id:'step2', num:'۲', label:'گام دوم: صدا و شیوهٔ نوشتن'},
    {id:'step3', num:'۳', label:'گام سوم: جمله‌سازی'},
    {id:'step4', num:'۴', label:'گام چهارم: واژگان پایه'},
    {id:'step5', num:'۵', label:'گام پنجم: ساخت کلمات جدید'},
    {id:'step6', num:'۶', label:'گام ششم: آزمون زبان'},
    {id:'step7', num:'۷', label:'یک قدم فراتر'},
    {id:'summary', num:'✓', label:'خلاصهٔ نهایی'}
  ];

  const STEP3_SUB = [
    {id:'what', label:'چه چیزهایی باید گفته شود؟'},
    {id:'order', label:'ترتیب کلمات'},
    {id:'time', label:'زمان'},
    {id:'number', label:'تعداد'},
    {id:'gender', label:'جنسیت یا دسته‌بندی'},
    {id:'neg', label:'منفی‌سازی'},
    {id:'quest', label:'پرسشی‌سازی'}
  ];

  const FLOW = [
    {top:'intro'}, {top:'step1'}, {top:'step2'},
    ...STEP3_SUB.map(s=>({top:'step3', sub:s.id})),
    {top:'step4'}, {top:'step5'}, {top:'step6'}, {top:'step7'}, {top:'summary'}
  ];

  function emptyWords(n){ return Array.from({length:n}, ()=>({concept:'', word:'', reason:''})); }
  function emptyDeriv(n){ return Array.from({length:n}, ()=>({col1:'', col2:'', col3:''})); }

  function defaultState(){
    return {
      intro:{read:true},
      step1:{beings:'', place:'', beliefs:''},
      step2:{sense:'', sounds:'', personalization:''},
      step3:{
        what:{explain:'', feature1:'', feature2:''},
        order:{order:'', customOrder:'', why:'', changes:'', changeExample:'', markingMethod:''},
        time:{sys:[], customSys:'', verb:'', present:'', past:'', future:'', method:'', methodExplain:''},
        number:{has:'', singNoun:'', pluralNoun:'', verbChanges:false, adjChanges:false, pronounChanges:false, otherChanges:'', sentSing:'', sentPlur:'', why:''},
        gender:{has:'', nouns:false, pronouns:false, adjectives:false, verbs:false, otherChanges:'', heForm:'', sheForm:'', theyForm:''},
        neg:{method:'', explain:'', positive:'', negative:''},
        quest:{method:'', explain:'', statement:'', question:''}
      },
      step4:{words: emptyWords(15)},
      step5:{
        number:{rows: emptyDeriv(4), rule:''},
        gender:{rows: emptyDeriv(4), rule:''},
        neg:{rows: emptyDeriv(4), rule:''},
        deriv:{rows: emptyDeriv(4)}
      },
      step6:{
        simple:'', simpleFa:'', simpleExp:'',
        timeNum:'', timeNumFa:'', timeNumExp:'',
        negative:'', negativeFa:'', negativeExp:'',
        question:'', questionFa:'', questionExp:'',
        rasta:'', rastaFa:'', rastaExp:''
      },
      step7:{
        choice:'',
        calendar:{basis:'', dayDef:'', monthDef:'', yearDef:'', yearLength:'', monthsCount:'', extraDays:'', monthNames:'', festivals:''},
        counting:{noNumberMethod:'', grouping:'', base:'', symbols: Array(5).fill(''), combineRule:'', zeroExplain:'', math1:'', math2:'', math3:''}
      }
    };
  }

  let STATE = defaultState();
  let flowIndex = 0;
  let saveTimer = null;

  function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function getPath(o,p){ return p.split('.').reduce((a,k)=>(a==null?a:a[k]),o); }
  function setPath(o,p,v){ const k=p.split('.'); let a=o; for(let i=0;i<k.length-1;i++)a=a[k[i]]; a[k[k.length-1]]=v; }

  function flashSaved(){
    const el = document.getElementById('savedFlag');
    el.classList.add('show'); clearTimeout(el._t);
    el._t = setTimeout(()=>el.classList.remove('show'), 900);
  }
  async function save(){
    try{ const res = await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false); if(res) flashSaved(); }
    catch(e){ console.error('save failed', e); }
  }
  function saveDebounced(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,500); }
  async function load(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        const def = defaultState();
        Object.keys(def).forEach(k=>{
          if(parsed[k]===undefined) return;
          if(k==='step3'){
            Object.keys(def.step3).forEach(sk=>{ def.step3[sk] = Object.assign(def.step3[sk], parsed.step3 && parsed.step3[sk] || {}); });
          } else if(k==='step4'){
            def.step4.words = (parsed.step4 && parsed.step4.words) ? parsed.step4.words : def.step4.words;
          } else if(k==='step5'){
            Object.keys(def.step5).forEach(sk=>{
              if(parsed.step5 && parsed.step5[sk]){
                if(Array.isArray(parsed.step5[sk].rows)) def.step5[sk].rows = parsed.step5[sk].rows;
                Object.assign(def.step5[sk], parsed.step5[sk]);
              }
            });
          } else if(k==='step7'){
            def.step7 = Object.assign(def.step7, parsed.step7||{});
          } else {
            def[k] = Object.assign(def[k], parsed[k]);
          }
        });
        STATE = def;
      }
    }catch(e){}
  }

  function fieldText(path,label,placeholder,hint){
    const v = getPath(STATE,path)||'';
    return `<div class="field"><label>${escapeHtml(label)}</label>
      <input type="text" data-field="${path}" value="${escapeHtml(v)}" placeholder="${escapeHtml(placeholder||'')}">
      ${hint?`<div class="hint">${hint}</div>`:''}</div>`;
  }
  function fieldArea(path,label,placeholder,hint){
    const v = getPath(STATE,path)||'';
    return `<div class="field"><label>${escapeHtml(label)}</label>
      <textarea data-field="${path}" placeholder="${escapeHtml(placeholder||'')}">${escapeHtml(v)}</textarea>
      ${hint?`<div class="hint">${hint}</div>`:''}</div>`;
  }
  function toggleGroup(path,label,options){
    const v = getPath(STATE,path)||'';
    return `<div class="field"><label>${escapeHtml(label)}</label><div class="toggle-group">
      ${options.map(o=>`<button type="button" class="toggle-btn ${v===o.value?'active':''}" data-toggle="${path}" data-value="${escapeHtml(o.value)}">${escapeHtml(o.text)}</button>`).join('')}
    </div></div>`;
  }
  function checkRow(path,label){
    const v = !!getPath(STATE,path);
    return `<div class="check-row" data-check="${path}"><span class="check-box ${v?'active':''}">${v?'✓':''}</span><span>${escapeHtml(label)}</span></div>`;
  }

  /* ---------- مقدمه ---------- */
  function renderIntro(){
    return `
      <div class="guide">
        <p><strong>رستایی عزیز، سلام!</strong></p>
        <p>به کارگاه زبان‌سازی خوش آمدید. شما قرار است به عنوان یک گروه مستقل و جدید وارد بازار رستا شوید. اما یک مشکل وجود دارد: <strong>هیچ تمدنی بدون زبان نمی‌تواند هویت مستقلی داشته باشد.</strong></p>
        <p>شما با گروه‌هایی و نشانه‌های ناشناخته‌ای روبرو هستید که هر کدام به شیوه‌ای با یکدیگر ارتباط برقرار می‌کنند؛ برخی با حرکت بدن، برخی با نور و برخی با صدا. در واقع هر گروه با ویژگی‌های خاص خود، در این دنیای عظیم و شلوغ بازار زندگی می‌کند و قوانین و توانایی‌های خاص خود را دارد.</p>
        <p>شما برای بار اول وارد بازار می‌شوید و هویت رسمی شما به عنوان یک داژن (گروه) مستقل ثبت نشده است. شما نه نامی دارید، نه زبانی شخصی و نه نشانی. اما برای اینکه به عنوان یک داژن مستقل شناخته شوید، باید هویت خود را بسازید. شما می‌توانید هر چیزی باشید: یک تمدن نیمه‌شفاف، یک گروه از تبارها، یا موجودیتی که تاکنون در این دنیا دیده نشده است.</p>
        <p>اما یک مشکل وجود دارد: <strong>هیچ داژنی بدون زبان نمی‌تواند هویت مستقل داشته باشد.</strong></p>
        <p>ماموریت شما این است که زبان مخصوص داژن خود را طراحی کنید. زبانی که دیگران بتوانند با شما ارتباط برقرار کنند و شما را بشناسند. قرار نیست فقط چند کلمه عجیب و غریب اختراع کنید؛ بلکه باید تصمیم بگیرید مفاهیم چگونه بیان می‌شوند، واژه‌ها چگونه ساخته می‌شوند و شنوندگان چه چیزی را مهم می‌دانند. در نهایت، شما نه فقط یک داژن جدید، بلکه زبانی خواهید داشت که بخشی از فرهنگ، تاریخ و نگاه شنوندگان به جهان را در خود نشان می‌دهد.</p>
      </div>

      <div class="card">
        <div class="section-title" style="font-size:18px;margin-bottom:16px;">قوانین طلایی زبان‌سازی</div>
        <div class="pale-box">
          <p><strong>۱. زبان شما نباید رمزگذاری یک زبان موجود باشد:</strong> جایگزینی ساده حروف، برعکس کردن کلمات، یا تعیین یک معادل جدید برای تک‌تک کلمات یک زبان موجود قابل قبول نیست. زبان شما باید یک سیستم جدید باشد.</p>

  function deepFilled(v){
    if(Array.isArray(v)) return v.some(deepFilled);
    if(v && typeof v==='object') return Object.values(v).some(deepFilled);
    if(typeof v==='boolean') return v;
    return v!=null && String(v).trim().length>0;
  }

    const orderLabel = {SOV:'فاعل–مفعول–فعل',SVO:'فاعل–فعل–مفعول',OSV:'مفعول–فاعل–فعل',OVS:'مفعول–فعل–فاعل',VSO:'فعل–فاعل–مفعول',VOS:'فعل–مفعول–فاعل',other:s.step3.order.customOrder}[s.step3.order.order];

    const filledWords = s.step4.words.filter(w=>w.concept||w.word);
    html += filledWords.length ? `<p>${filledWords.map(w=>escapeHtml((w.concept||'؟')+' = '+(w.word||'؟'))).join(' · ')}</p>` : `<p class="empty">تکمیل نشده</p>`;

    html += `<h3>گام ۵: ساخت کلمات جدید</h3>`;
    html += `<p>جمع: ${escapeHtml(s.step5.number.rows[0]?.col1||'—')} ← ${escapeHtml(s.step5.number.rows[0]?.col3||'—')}<br>منفی: ${escapeHtml(s.step5.neg.rows[0]?.col1||'—')} ← ${escapeHtml(s.step5.neg.rows[0]?.col3||'—')}</p>`;

    html += `<h3>گام ۶: آزمون زبان</h3>`;
    html += deepFilled(s.step6) ? `<p>پیام به رستا: ${escapeHtml(s.step6.rastaFa||'—')}</p>` : `<p class="empty">تکمیل نشده</p>`;

    html += `<h3>گام ۷: یک قدم فراتر</h3>`;
    html += `<p>چالش انتخاب‌شده: ${s.step7.choice==='calendar'?'طراحی تقویم':(s.step7.choice==='counting'?'طراحی سیستم شمارش':'انتخاب نشده')}</p>`;

    html += `<button class="copy-btn" id="copySummary">کپی کردن خلاصه</button></div>`;
    return html;
  }

  function topLabel(id){ return TOP.find(t=>t.id===id); }
  function isTopFilled(id){
    if(id==='summary' || id==='intro') return false;
    return deepFilled(STATE[id]);
  }
  function overallProgress(){
    const real = TOP.filter(t=>t.id!=='summary' && t.id!=='intro');
    const filled = real.filter(t=>isTopFilled(t.id)).length;
    return Math.round((filled/real.length)*100);
  }
  function toFaDigits(n){
    const map={'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
    return String(n).replace(/[0-9]/g,d=>map[d]);
  }

  function renderRail(){
    const cur = FLOW[flowIndex];
    const rail = document.getElementById('rail');
    rail.innerHTML = TOP.map(t=>`
      <div class="rail-item ${t.id===cur.top?'active':''} ${isTopFilled(t.id)?'filled':''}" data-goto="${t.id}">
        <span class="rail-num">${t.num}</span><span>${t.label}</span>
      </div>`).join('');
    rail.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click', ()=>gotoTop(el.dataset.goto)));

    const tabs = document.getElementById('mobileTabs');
    tabs.innerHTML = TOP.map(t=>`<div class="mobile-tab ${t.id===cur.top?'active':''}" data-goto="${t.id}">${t.num} ${t.label}</div>`).join('');
    tabs.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click', ()=>gotoTop(el.dataset.goto)));
  }
  function gotoTop(id){
    const i = FLOW.findIndex(f=>f.top===id);
    flowIndex = i>=0?i:0;
    renderAll();
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function updateProgress(){
    const pct = overallProgress();
    document.getElementById('progressFill').style.width = pct+'%';
    document.getElementById('progressLabel').textContent = toFaDigits(pct)+'٪';
  }

  const TOP_RENDERERS = {
    intro:renderIntro, step1:renderStep1, step2:renderStep2,
    step4:renderStep4, step5:renderStep5, step6:renderStep6,
    step7:renderStep7, summary:renderSummary
  };

  function renderStage(){
    const cur = FLOW[flowIndex];
    const meta = topLabel(cur.top);
    const stage = document.getElementById('stage');
    let bodyHtml;
    if(cur.top==='step3'){
      bodyHtml = renderStep3(cur.sub);
    } else {
      bodyHtml = TOP_RENDERERS[cur.top]();
    }
    const posLabel = `مرحلهٔ ${toFaDigits(flowIndex+1)} از ${toFaDigits(FLOW.length)}`;
    stage.innerHTML = `
      <div class="section-head">
        <div class="section-eyebrow">${posLabel}</div>
        <h2 class="section-title">${meta.label}${cur.sub?' — '+STEP3_SUB.find(s=>s.id===cur.sub).label:''}</h2>
      </div>
      ${bodyHtml}
      <div class="nav-buttons">
        <button class="nav-btn" id="prevBtn" ${flowIndex===0?'disabled':''}>→ قبلی</button>
        <button class="nav-btn primary" id="nextBtn" ${flowIndex===FLOW.length-1?'disabled':''}>${flowIndex===FLOW.length-1?'پایان':'بعدی ←'}</button>
      </div>`;
    wireStage(stage);
  }

  function wireStage(stage){
    stage.querySelectorAll('input[data-field], textarea[data-field]').forEach(el=>{
      el.addEventListener('input', ()=>{
        setPath(STATE, el.dataset.field, el.value);
        saveDebounced(); updateProgress(); renderRail();
      });
    });
    stage.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const path = el.dataset.toggle, val = el.dataset.value;
        const curVal = getPath(STATE, path);
        setPath(STATE, path, curVal===val ? '' : val);
        saveDebounced(); renderStage(); updateProgress(); renderRail();
      });
    });
    stage.querySelectorAll('[data-multitoggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const path = el.dataset.multitoggle, val = el.dataset.value;
        const arr = getPath(STATE, path);
        const i = arr.indexOf(val);
        if(i===-1) arr.push(val); else arr.splice(i,1);
        saveDebounced(); renderStage(); updateProgress(); renderRail();
      });
    });
    stage.querySelectorAll('[data-check]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const path = el.dataset.check;
        setPath(STATE, path, !getPath(STATE, path));
        saveDebounced(); renderStage(); updateProgress(); renderRail();
      });
    });
    stage.querySelectorAll('[data-s3goto]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const idx = FLOW.findIndex(f=>f.top==='step3' && f.sub===el.dataset.s3goto);
        if(idx>=0){ flowIndex = idx; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }
      });
    });
    const prev = document.getElementById('prevBtn');
    const next = document.getElementById('nextBtn');
    if(prev) prev.addEventListener('click', ()=>{ if(flowIndex>0){ flowIndex--; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); } });
    if(next) next.addEventListener('click', ()=>{ if(flowIndex<FLOW.length-1){ flowIndex++; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); } });

    const copyBtn = document.getElementById('copySummary');
    if(copyBtn){
      copyBtn.addEventListener('click', async ()=>{
        const text = document.getElementById('summaryText').innerText;
        try{ await navigator.clipboard.writeText(text); copyBtn.textContent='کپی شد ✓'; setTimeout(()=>copyBtn.textContent='کپی کردن خلاصه',1400); }
        catch(e){ copyBtn.textContent='کپی نشد'; }
      });
    }
  }

  function renderAll(){ renderRail(); renderStage(); updateProgress(); }

  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    if(!confirm('همهٔ پاسخ‌های این کارگاه پاک شود؟ این کار قابل بازگشت نیست.')) return;
    STATE = defaultState();
    try{ await window.storage.delete(STORAGE_KEY, false); }catch(e){}
    flowIndex = 0;
    renderAll();
  });

  (async function init(){
    await load();
    renderAll();
  })();

})();
</script>
</body>
</html>
